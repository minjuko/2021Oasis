name: Rails CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7.0'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: bin/rails db:prepare
      - run: bin/rails test
      - name: Precompile production assets
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ci-placeholder
        run: bin/rails assets:precompile
